services:
  brain:
    build: .
    image: portable-brain
    container_name: brain
    restart: "no"
    # interactive terminal for the Claude Code TUI (equivalent to docker run -it)
    stdin_open: true
    tty: true
    volumes:
      # your knowledge lives on the host and is mounted in
      - ${HOME}/brain:/brain
      - ${HOME}/IdeaProjects:/work/
      - ${HOME}/PycharmProjects/:/work/kandi
      # Persist Claude Code state across container recreation: session
      # transcripts, auto-memory (~/.claude/projects/*/memory/), settings,
      # and the Max/Pro login (~/.claude/.credentials.json) all live here.
      # Deliberately a sibling of ~/brain, not nested inside it: the vault is
      # synced (Obsidian) across machines and should hold durable knowledge;
      # this dir is per-machine working state for Claude and must never sync,
      # or memory from one machine bleeds into another's.
      # Create the host dir first: `mkdir -p ~/brain-claude`
      - ${HOME}/brain-claude:/root/.claude
    # environment:
    #   # override the default bootstrap areas if needed
    #   BRAIN_AREAS: "work:confidential live:personal education:personal"
    #   # headless auth instead of interactive /login (subscription token, not an API key)
    #   CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
